<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <style>
    *{
      box-sizing: border-box;
    }
    body{
      font-family: arial;
      padding: 0;
      margin: 0;
    }
    
    .todo-grid, .todo-input-grid{
      display: grid;
      grid-template-columns: 160px 120px 100px;
      column-gap: 10px;
      row-gap: 10px;
      align-items: center;
    }
    .todo-input-grid input[type="date"]{ /* Targeting the text input specifically */
      width: 120px;
    }
    .todo-input-grid{
      margin-bottom: 10px;
    }
    .name-input, .due-date-input{
      font-size: 15px;
      padding: 6px;
    }
    .btn{
      color: white;
      background-color: green;
      border: none;
      font-size: 15px;
      cursor: pointer;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    .delete-btn{
      background-color: darkred;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    section{
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    p{
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- FIRST TYPE OF TODO LIST
  <p>Todo List</p>
  <input type="text" placeholder="Todo Name" class="js-name-input">
  <button onclick="
    addTodo();
  ">Add</button>
-->
<!--SECOND TYPE OF TODO LIST-->
<section>
 <p>Todo List</p>
 <div class="todo-input-grid">
    <input type="text" placeholder="Todo Name" class="js-name-input name-input">
    <input type="date" class="js-due-date-input due-date-input">
    <button onclick="
        addTodo();
      " class="btn">Add
    </button>
 </div>
 <div class="js-todo-list todo-grid"></div>
</section>
  
  <!-- Steps(Algorithm)
    1. Create array to store todos
    2. When we click "Add", (3.)Get text from textbox
    4. Add it to array
    5. Console.log()the array
    
    For second todo, steps;
    1. Loop through the array
    2. Create some html code for each todo
    3. Put the html on web page
  -->
  <script src="12-todo-list.js"></script>
</body>
</html>
