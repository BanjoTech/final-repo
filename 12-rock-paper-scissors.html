<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-paper-scissors-booleans</title>
  <link rel="stylesheet" href="12-rock-paper-scissors.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>
  <button class="move-btn js-rock-btn">
    <img src="/images/rock-emoji.png" alt="" class="move-icon">
  </button>

 

<button class="move-btn js-paper-btn">
  <img src="/images/paper-emoji.png" alt="" class="move-icon">
</button>



<button class="move-btn js-scissors-btn">
  <img src="/images/scissors-emoji.png" alt="" class="move-icon">
</button>

<p class="js-moves moves"></p>
<p class="js-result result"></p>
<p class="js-score score"></p>


<button class="reset-btn js-reset-btn">Reset score</button>

<button class="auto-btn js-auto-btn">Auto Play
</button>

<script src="12-rock-papper-scissors.js">
</script>
</body>
</html>
