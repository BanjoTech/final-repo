<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-paper-scissors-booleans</title>
</head>
<body>
  <p>Rock Paper Scissors</p>
  <button onclick="
  playGame('rock');
  
  ">Rock</button>

 

<button onclick="
  playGame('Paper');
  ">Paper</button>



<button onclick="
   playGame('Scissors');


  ">Scissors</button>

  <p class="js-result"></p>
  <p class="js-moves"></p>
  <p class="js-score"></p>


<button onclick="
  score.wins = 0;
  score.losses = 0;
  score.ties = 0;
  localStorage.removeItem('score');
  updateScoreElement();
">Reset score</button>


  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      
    };

    updateScoreElement();
    gameResult(gameResultText);
    gameMove(playerMove, computerMove);
      
    /* This code does the same thing as above starting from the OR sign ||
    if (!score) {
      score = {
        wins: 0,
        losses: 0,
        ties: 0
      }
    }
    */

//     // let gameResult = '';
//     let gameMove = '';
// //     let computerMove = '';


    
    function playGame(playerMove){
      const computerMove = pickComputerMove();

      let gameResultText = '';

      if (playerMove === 'Scissors') {
       if (computerMove === 'rock'){
        gameResultText = 'You Lose Motherfucker!!';
       }else if (computerMove === 'Paper') {
        gameResultText = 'You Win!!';
       }else if (computerMove === 'Scissors') {
        gameResultText = 'It is a Tie';
        }
      }else if (playerMove === 'Paper') {
        if (computerMove === 'rock'){
          gameResultText = 'You Win!!';
        }else if (computerMove === 'Paper') {
          gameResultText = 'It is a Tie';
        }else if (computerMove === 'Scissors') {
          gameResultText = 'You Lose Motherfucker!!';
       }        
      } else if (playerMove === 'rock') {
        if (computerMove === 'rock'){
          gameResultText = 'It is a Tie';
        }else if (computerMove === 'Paper') {
          gameResultText = 'You Lose Motherfucker!!';
        }else if (computerMove === 'Scissors') {
          gameResultText = 'You Win!!';
        }
      }
      
      if (gameResultText === 'You Win!!') {
        score.wins += 1;
      } else if (gameResultText === 'You Lose Motherfucker!!') {
        score.losses += 1;
      } else if (gameResultText === 'It is a Tie') {
        score.ties += 1;
      }
      
      localStorage.setItem('score', JSON.stringify(score));

      updateScoreElement();
      gameResult(gameResultText);
      gameMove(playerMove, computerMove);
      
      // document.querySelector('.js-result').innerHTML = result;

      // document.querySelector('.js-moves').innerHTML = `Your-move: ${playerMove} ---- Computer-move: ${computerMove}`;
    }

//       alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
// Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
//     }

    function updateScoreElement(){
      document.querySelector('.js-score').innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }

    function gameResult(gameResultText){
      document.querySelector('.js-result').innerHTML = gameResultText;
    }

    function gameMove(playerMove, computerMove){
      document.querySelector('.js-moves').innerHTML = `You: ${playerMove} ---- Computer: ${computerMove}`;
    }

    function pickComputerMove() {
    const randomNumber = Math.random();

    let computerMove = '';


    if (randomNumber >= 0 && randomNumber < 1/3) {
      computerMove = 'rock';
    } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
      computerMove = 'Paper';
    } else if (randomNumber >= 2/3 && randomNumber < 1) {
      computerMove = 'Scissors';
    }

    return computerMove;
    }
  </script>
</body>
</html>
