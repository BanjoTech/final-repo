<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart-quantity-lesson</title>
</head>
<body>
  <button onclick="
    console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

  <button onclick="
  cartQuantity = cartQuantity + 1;
  console.log(`Cart quantity: ${cartQuantity}`);
  ">Add to Cart</button>

  <button onclick="
  cartQuantity = cartQuantity + 2;
  //To shortcut the code above this line, write the code this way: cartQuantity += 2; [You may do the same for others too and it will give you same result]
  console.log(`Cart quantity: ${cartQuantity}`);
  ">+2</button>

  <button onclick="
  cartQuantity = cartQuantity + 3;
  console.log(`Cart quantity: ${cartQuantity}`);
  ">+3</button>
  
  <button onclick="
  cartQuantity = 0;
  console.log('Cart was Reset....');
  console.log(`Cart quantity: ${cartQuantity}`);
  ">Reset Cart</button>
  <script>
    let cartQuantity = 0;
  </script>
