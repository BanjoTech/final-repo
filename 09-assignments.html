<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>

  <!-- <button onclick="

  ">heads</button>
  <button onclick="

  ">tails</button> -->
  <!-- <p class="js-btn-result"></p> -->


  <input placeholder="Enter your name" class="js-input" onkeydown="
    handleCostKeydown (event);">

  <button onclick="
    nameResult();
  ">Submit</button>

  <button class="clear">Clear</button>

  <p class="js-your-name-display"></p>
  
  <script>

    function handleCostKeydown (event) {
      if (event.key === 'Enter') {
          nameResult();
      }
    }
    function nameResult () {
      const inputElement = document.querySelector('.js-input');

      document.querySelector('.js-your-name-display').innerHTML = `Your name is: ${inputElement.value}`;
    }

    const nameDisplay = document.querySelector('.js-your-name-display');
    const inputField = document.querySelector('.js-input');
    const clearButton = document.querySelector('.clear');

    clearButton.addEventListener('click', () => {
      nameDisplay.innerHTML = '';
      inputField.value = '';
    });

    // console.log(document.querySelector('button'));
    // document.querySelector('.btn').innerText = '9B done';
  </script>
</body>
</html>
